<style>
  /* Peach, orange and white. Flat peach page, white cards, one orange accent, serif for headlines and numbers. */
  :root {
    --page: #f8d8c7; --card: #ffffff; --soft: #fcefe7; --line: #f1c7ae;
    --text: #2b1c15; --dim: #8a6b5c; --o: #e07b2c; --o2: #d56d1f;
    --win: #bd5a12; --loss: #a8968c; --bad: #c43a1e; --ink: #2b1c15; --r: 24px;
    --ease: cubic-bezier(.32,.72,0,1);
    --glide: cubic-bezier(.22,1,.36,1);   /* long, soft settle for sliding panels */
    --bounce: cubic-bezier(.34,1.5,.5,1); /* slight overshoot for the tab bubble */
    --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
    --sans: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --tabs-h: 64px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { background: var(--page); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.5 var(--sans);
         padding-bottom: calc(var(--tabs-h) + 34px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden; }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: 20; background: var(--page);
           padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px; }
  header .in { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  h1 { margin: 0; font: 400 38px/0.95 var(--serif); color: var(--o2); letter-spacing: -.005em; }
  #dates { color: var(--dim); font-size: 12px; margin-top: 5px; }
  .weeknav { display: flex; align-items: center; gap: 4px; }
  .weeknav b { font: 400 22px/1 var(--serif); min-width: 78px; text-align: center; color: var(--text); }
  .weeknav button { width: 38px; height: 38px; padding: 0; border-radius: 999px; background: var(--soft);
                    border: 1px solid var(--line); color: var(--o2); font-size: 20px; line-height: 1; }

  /* ---------- panels ---------- */
  main { max-width: 720px; margin: 0 auto; padding: 6px 16px 0; }
  .viewport { overflow: clip; box-sizing: content-box; padding-block: 26px; margin: -26px -16px;
              transition: height .55s var(--glide); } /* padding leaves room for the card glow */
  .track { display: flex; align-items: flex-start; }
  .panel { flex: 0 0 100%; min-width: 0; padding: 0 16px;
           will-change: transform; transform: translateX(0);
           transition: transform .6s var(--glide); }

  /* ---------- cards ---------- */
  .slip { background: var(--card); border: 2px solid var(--o); border-radius: var(--r);
          box-shadow: 0 8px 30px rgba(224,123,44,.20); padding: 18px 16px; margin-bottom: 18px; min-width: 0; }
  h2 { margin: 0 0 12px; font: 400 30px/1.05 var(--serif); color: var(--o2); text-wrap: balance; }
  h3 { margin: 0 0 8px; font: 400 24px/1.1 var(--serif); color: var(--o2); }
  .slip h2[style*="margin-top"] { margin-top: 26px !important; }
  .mute { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ---------- controls ---------- */
  input, select { flex: 1; min-width: 120px; padding: 12px 14px; font: 16px var(--sans); color: var(--text);
                  background: var(--soft); border: 1px solid var(--line); border-radius: 14px; }
  input::placeholder { color: var(--dim); }
  select option { background: var(--card); color: var(--text); }
  button { font: 500 15px var(--sans); border: 0; border-radius: 14px; padding: 12px 14px; cursor: pointer;
           background: var(--soft); color: var(--text); -webkit-tap-highlight-color: transparent; }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--o2); outline-offset: 2px; }
  .go { background: var(--o); color: var(--ink); font-weight: 600; }
  .danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); font-weight: 600; }
  .sm { padding: 6px 10px; font-size: 13px; border-radius: 10px; }

  /* ---------- games ---------- */
  .game { padding: 16px 0; border-top: 1px solid var(--line); }
  .game:first-of-type { border-top: 0; }
  .teams { font: 400 23px/1.15 var(--serif); color: var(--text); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 8px; }
  .opts button { font: 400 21px/1 var(--serif); padding: 13px 8px; border: 1px solid transparent; }
  .opts button.on { background: var(--o); color: var(--ink); }
  .mults { display: flex; gap: 8px; }
