<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041e42">
<title>Spread Em' League</title>
<style>
  /* Georgetown navy and gray. Flat navy page, lighter navy cards, gray text and accents; bold Helvetica throughout. */
  :root {
    --page: #041e42; --card: #0b2a57; --soft: #143665; --line: #2b4a78;
    --text: #c8cacc; --dim: #8e949b; --o: #bbbcbc; --o2: #e3e4e5;
    --win: #00b5e2; --loss: #6f7a88; --bad: #ff6680; --ink: #041e42; --r: 24px;
    --ease: cubic-bezier(.32,.72,0,1);
    --glide: cubic-bezier(.22,1,.36,1);   /* long, soft settle for sliding panels */
    --bounce: cubic-bezier(.34,1.5,.5,1); /* slight overshoot for the tab bubble */
    --serif: 'Helvetica Neue', Helvetica, Arial, sans-serif; /* headline face: same family, set bold */
    --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --tabs-h: 64px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--page); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--page); color: var(--text); font: 500 15px/1.5 var(--sans);
         padding-bottom: calc(var(--tabs-h) + 34px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden; }

  /* ---------- header ---------- */
  header { position: sticky; top: 0; z-index: 20; background: var(--page);
           padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px; }
  header .in { max-width: 720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  h1 { margin: 0; font: 800 31px/1 var(--serif); color: var(--o2); letter-spacing: -.02em; white-space: nowrap; }
  #dates { color: var(--dim); font-size: 12px; margin-top: 5px; }
  .weeknav { display: flex; align-items: center; gap: 4px; }
  .weeknav b { font: 700 19px/1 var(--serif); min-width: 72px; white-space: nowrap; text-align: center; color: var(--text); }
  .weeknav button { width: 38px; height: 38px; padding: 0; border-radius: 999px; background: var(--soft);
                    border: 1px solid var(--line); color: var(--o2); font-size: 20px; line-height: 1; }

  /* chance-of-winning cell */
  td.odds { min-width: 52px; width: 52px; padding-left: 4px; }
  td.odds b { font: 700 15px/1 var(--serif); color: var(--o2); }
  td.odds .bar { display: block; height: 3px; margin-top: 5px; border-radius: 2px; background: var(--line); }
  td.odds .bar i { display: block; height: 100%; border-radius: 2px; background: var(--win); }

  /* ---------- panels ---------- */
  main { max-width: 720px; margin: 0 auto; padding: 6px 16px 0; }
  .viewport { overflow: clip; box-sizing: content-box; padding-block: 26px; margin: -26px -16px;
              transition: height .55s var(--glide); } /* padding leaves room for the card glow */
  .track { display: flex; align-items: flex-start; }
  .panel { flex: 0 0 100%; min-width: 0; padding: 0 16px;
           will-change: transform; transform: translateX(0);
           transition: transform .6s var(--glide); }

  /* ---------- cards ---------- */
  .slip { background: var(--card); border: 2px solid var(--o); border-radius: var(--r);
          box-shadow: 0 8px 28px rgba(0,0,0,.30); padding: 18px 16px; margin-bottom: 18px; min-width: 0; }
  h2 { margin: 0 0 12px; font: 700 26px/1.1 var(--serif); letter-spacing: -.015em; color: var(--o2); text-wrap: balance; }
  h3 { margin: 0 0 8px; font: 700 24px/1.1 var(--serif); color: var(--o2); }
  .slip h2[style*="margin-top"] { margin-top: 26px !important; }
  .mute { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ---------- controls ---------- */
  input, select { flex: 1; min-width: 120px; padding: 12px 14px; font: 16px var(--sans); color: var(--text);
                  background: var(--soft); border: 1px solid var(--line); border-radius: 14px; }
  input::placeholder { color: var(--dim); }
  select option { background: var(--card); color: var(--text); }
  button { font: 600 15px var(--sans); border: 0; border-radius: 14px; padding: 12px 14px; cursor: pointer;
           background: var(--soft); color: var(--text); -webkit-tap-highlight-color: transparent; }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--o2); outline-offset: 2px; }
  .go { background: var(--o); color: var(--ink); font-weight: 600; }
  .danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); font-weight: 600; }
  .sm { padding: 6px 10px; font-size: 13px; border-radius: 10px; }

  /* ---------- press feedback for action buttons (save, log in, reset, apply, pay) ---------- */
  .go, .danger, .pay { position: relative; overflow: visible;
       transition: transform .32s var(--bounce), filter .25s var(--ease), background-color .25s var(--ease); }
  .save { position: sticky; }
  .go.tap, .danger.tap, .pay.tap { transform: scale(.94); filter: brightness(.82); transition-duration: .08s; }
  .go::after, .danger::after, .pay::after { content: ''; position: absolute; inset: 0; border-radius: inherit;
       pointer-events: none; opacity: 0; box-shadow: 0 0 0 0 var(--o2); }
  .danger::after { box-shadow: 0 0 0 0 var(--bad); }
  .pay::after { box-shadow: 0 0 0 0 var(--win); }
  .go.ring::after, .danger.ring::after, .pay.ring::after { animation: ring .55s var(--ease); }
  @keyframes ring { 0% { opacity: .75; box-shadow: 0 0 0 0 currentColor; }
                    100% { opacity: 0; box-shadow: 0 0 0 12px currentColor; } }
  .go::after { color: var(--o2); } .danger::after { color: var(--bad); } .pay::after { color: var(--win); }
  .go:disabled::after, .danger:disabled::after { display: none; }

  /* ---------- games ---------- */
  .game { padding: 16px 0; border-top: 1px solid var(--line); }
  .game:first-of-type { border-top: 0; }
  .teams { font: 700 19px/1.25 var(--serif); color: var(--text); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 8px; }
  .opts button { font: 700 14px/1.1 var(--sans); letter-spacing: -.02em; padding: 15px 2px; border: 1px solid transparent; }
  .opts button.on { background: var(--o); color: var(--ink); }
  .mults { display: flex; gap: 8px; }
  .mults button { flex: 1; padding: 8px; font-weight: 600; border: 1px solid transparent; }
  .mults button.on { background: transparent; border-color: var(--o); color: var(--o2); }
  .save { position: sticky; bottom: calc(var(--tabs-h) + 22px + env(safe-area-inset-bottom, 0px)); z-index: 5;
          width: 100%; padding: 15px; font-size: 16px; margin-top: 10px; border-radius: 999px;
          box-shadow: 0 6px 20px rgba(0,0,0,.45), 0 0 0 4px var(--card); }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  tr:last-child > td { border-bottom: 0; }
  th { color: var(--dim); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  td.num { font: 700 20px/1 var(--serif); color: var(--text); }
  #weekboard > table > tbody > tr.pick-row > td:first-child,
  #season table td:first-child { font: 700 19px/1 var(--serif); color: var(--o2); width: 30px; }
  #season th, #season td { padding-left: 4px; padding-right: 4px; }
  .win { color: var(--win); font-weight: 600; } .loss { color: var(--loss); font-weight: 600; }
  .live { opacity: .7; font-style: italic; }
  #weekboard tr.pick-row { cursor: pointer; }
  #weekboard tr.pick-row:hover td, #weekboard tr.sel td { background: var(--soft); }
  td.detail { white-space: normal; padding: 4px 0 10px; }
  td.detail > table { background: var(--soft); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  td.detail > table th, td.detail > table td { padding: 9px 10px; }
  .detail-wrap { overflow-x: auto; max-width: min(652px, calc(100vw - 68px)); }
  .paid td { color: var(--dim); text-decoration: line-through; }
  .paid td.keep { text-decoration: none; }
  a.venmo { color: var(--win); font-weight: 600; text-decoration: none; font-size: 13px; }
  .owe { background: var(--soft); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 6px; margin-bottom: 16px; }
  .owe h2 { font-size: 20px; margin-bottom: 6px; }
  .owe-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .owe-row:first-of-type { border-top: 0; }
  a.pay { display: inline-block; background: var(--win); color: var(--ink); font-weight: 700; font-size: 15px;
          text-decoration: none; padding: 11px 16px; border-radius: 999px; white-space: nowrap; -webkit-tap-highlight-color: transparent; }

  /* ---------- who-picked-what: table on wide screens, stacked blocks on phones ---------- */
  .grid-wide { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .grid-narrow { display: none; }
  .gcard { padding: 12px 0; border-top: 1px solid var(--line); }
  .gcard:first-child { border-top: 0; padding-top: 2px; }
  .ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .gteams { font: 700 18px/1.2 var(--serif); color: var(--text); }
  .gcount { font-size: 12px; font-weight: 700; color: var(--dim); white-space: nowrap; }
  .gcount.all { color: var(--win); }
  .gpicks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .gp { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-width: 0;
        background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; font-size: 13px; }
  .gp.none { background: transparent; border-style: dashed; }
  .gn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .gv { white-space: nowrap; flex-shrink: 0; }
  .gp.none .gv { color: var(--dim); }
  @media (max-width: 600px) {
    #grid.scroll { overflow-x: visible; }
    .grid-wide { display: none; }
    .grid-narrow { display: block; }
  }

  /* ---------- admin ---------- */
  #admin h2:first-child::before { content: 'Commissioner'; display: block; font: 600 11px var(--sans);
       letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
  .stat { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .stat:last-of-type { border-bottom: 0; }
  .stat b { font-weight: 600; text-align: right; }
  footer { text-align: center; padding: 4px 0 8px; }
  footer button { background: none; color: var(--dim); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }

  /* ---------- toast ---------- */
  #msg { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 60;
         max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 999px;
         background: var(--card); border: 2px solid var(--o); color: var(--text); font-size: 14px; font-weight: 500;
         box-shadow: 0 8px 26px rgba(0,0,0,.45); text-align: center;
         transform: translate(-50%, 0); transition: transform .38s var(--ease); pointer-events: none; }
  #msg:empty { transform: translate(-50%, calc(-100% - 40px)); }
  #msg.bad { border-color: var(--bad); color: var(--bad); }

  /* ---------- tab bar ---------- */
  .tabs { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
          bottom: calc(14px + env(safe-area-inset-bottom, 0px));
          width: min(440px, calc(100% - 28px)); height: var(--tabs-h);
          display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px;
          background: var(--card); border: 0; border-radius: 999px;
          box-shadow: 0 12px 32px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.25);
          touch-action: none; user-select: none; -webkit-user-select: none; }
  .tabs button { position: relative; z-index: 1; background: none; border-radius: 999px; padding: 0;
                 color: var(--dim); font-weight: 600; font-size: 14px;
                 transition: color .35s var(--glide), scale .35s var(--bounce); }
  .tabs button:active { scale: .94; }
  .tabs button.on { color: var(--ink); }
  .thumb { position: absolute; z-index: 0; top: 6px; bottom: 6px; left: 6px; border-radius: 999px; background: var(--o);
           box-shadow: 0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 #dcdddd;
           will-change: transform; transform-origin: center;
           transition: transform .62s var(--bounce), width .62s var(--bounce), scale .4s var(--bounce); }
  .tabs.pressing .thumb { scale: 1.04 1.08; }
  .dragging .panel, .dragging .viewport { transition-duration: 0s; }
  .dragging .thumb { transition: transform 0s, width 0s, scale .4s var(--bounce); }

  @media (prefers-reduced-motion: reduce) {
    .panel, .thumb, #msg, .tabs button, .viewport { transition-duration: 0s !important; }
    .go::after, .danger::after, .pay::after { animation: none !important; }
  }
</style>
</head>
<body>
<header><div class="in">
  <div><h1>Spread Em'</h1><div id="dates"></div></div>
  <div class="weeknav"><button onclick="go(-1)" aria-label="Previous week">‹</button><b id="wk">Week</b><button onclick="go(1)" aria-label="Next week">›</button></div>
</div></header>
<div id="msg" role="status" aria-live="polite"></div>
<main>
  <div class="viewport"><div class="track" id="track">
    <div class="panel" data-tab="picks">
      <section class="slip" id="auth"></section>
      <section class="slip" id="mypicks"></section>
    </div>
    <div class="panel" data-tab="standings">
      <section class="slip"><h2>This week</h2><div id="weekboard"></div></section>
      <section class="slip"><h2>Season standings</h2><div id="season"></div></section>
    </div>
    <div class="panel" data-tab="board">
      <section class="slip"><h2>Who picked what</h2><div class="scroll" id="grid"></div></section>
    </div>
    <div class="panel" data-tab="money">
      <section class="slip"><h2>Who owes who</h2><div class="scroll" id="money"></div></section>
    </div>
  </div></div>
  <section class="slip" id="admin" hidden></section>
  <footer><button onclick="toggleAdmin()">Admin</button></footer>
</main>
<nav class="tabs" id="tabs" aria-label="Sections">
  <span class="thumb" id="thumb"></span>
  <button data-i="0" class="on">Picks</button><button data-i="1">Standings</button><button data-i="2">Board</button><button data-i="3">Money</button>
</nav>

<script>
let token = localStorage.getItem('token'), myName = localStorage.getItem('name');
let week = null, D = null, draft = {};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const short = t => esc(t.split(' ').slice(-1)[0]);
const sgn = x => (x > 0 ? '+' : '') + x;
const started = g => Date.parse(g.kickoff) <= Date.now();

let msgTimer = null;
function msg(t, bad) {
  $('msg').textContent = t || ''; $('msg').className = bad ? 'bad' : 'mute';
  clearTimeout(msgTimer);
  if (t) msgTimer = setTimeout(() => { $('msg').textContent = ''; }, bad ? 5000 : 2600);
}

async function api(path, opts = {}) {
  opts.headers = { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) };
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ error: 'Server error' }));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

async function load(n) {
  msg('Loading…');
  try {
    D = await api('/api/week' + (n ? '?week=' + n : ''));
    week = D.week;
    if (token && !D.myName) { clearLogin(); }
    draft = JSON.parse(JSON.stringify((D.me && D.picks[D.me]) || {}));
    render(); msg('');
  } catch (e) { msg(e.message, true); }
}
async function go(d) { await load(Math.max(1, (week || 1) + d)); if (!$('admin').hidden && adminPw) adminCall('status'); }

// Same scoring as the server: right = 1/2/3, wrong = 0/-1/-2
function grade(g, res, p) {
  const hs = res.home, as = res.away, m = p.mult || 1;
  const win = p.pick === 'home' ? hs + g.spread > as
            : p.pick === 'away' ? as - g.spread > hs
            : p.pick === 'over' ? hs + as > g.total : hs + as < g.total;
  return { win, pts: win ? m : (m === 1 ? 0 : m === 2 ? -1 : -2) };
}
function label(g, pick) {
  return pick === 'home' ? short(g.home) + ' ' + sgn(g.spread)
       : pick === 'away' ? short(g.away) + ' ' + sgn(-g.spread)
       : pick === 'over' ? 'Over ' + g.total : 'Under ' + g.total;
}

function render() {
  $('wk').textContent = 'Week ' + D.week;
  const fmt = d => new Date(d).toLocaleDateString([], { month: 'short', day: 'numeric' });
  $('dates').textContent = fmt(D.range[0]) + ' – ' + fmt(Date.parse(D.range[1]) - 1) + (D.week === D.currentWeek ? ' (this week)' : '');
  renderAuth(); renderPicks();
  renderWeekBoard();
  $('season').innerHTML = seasonBoard(D.season);
  renderGrid(); renderMoney();
}

function renderAuth() {
  if (token && myName) {
    $('auth').innerHTML = `<div class="row" style="justify-content:space-between;align-items:center">
      <div>Playing as <b>${esc(myName)}</b></div><button onclick="clearLogin();load(week)">Log out</button></div>`;
    return;
  }
  $('auth').innerHTML = `<h2>Log in</h2>
    <div class="row"><input id="nm" placeholder="Name" autocomplete="username">
    <input id="pn" placeholder="PIN (4–8 digits)" inputmode="numeric" type="password" autocomplete="current-password"></div>
    <div class="row"><input id="cd" placeholder="League code (only when joining)"></div>
    <div class="row"><button class="go" onclick="auth('login')">Log in</button><button onclick="auth('register')">Join league</button></div>`;
}
async function auth(mode) {
  try {
    const j = await api('/api/login', { method: 'POST', body: JSON.stringify({ mode, name: $('nm').value, pin: $('pn').value, code: $('cd').value }) });
    token = j.token; myName = j.name;
    localStorage.setItem('token', token); localStorage.setItem('name', myName);
    load(week);
  } catch (e) { msg(e.message, true); }
}
function clearLogin() { token = null; myName = null; localStorage.removeItem('token'); localStorage.removeItem('name'); }

function renderPicks() {
  const el = $('mypicks'), open = D.window === 'open', canPick = !!D.me && open;
  if (!D.games.length) { el.innerHTML = '<h2>Games</h2><div class="mute">No locked lines yet this week. Games appear here as the admin locks them.</div>'; return; }
  const banner = open ? '<b class="win">Picks are open.</b> Save before the admin closes picks. Games also lock at kickoff.'
    : D.window === 'closed' ? '<b class="loss">Picks are closed.</b> Everyone\'s picks are shown below.'
    : '<b>Picks aren\'t open yet.</b> The admin will open picks soon.';
  let h = `<h2>${D.me ? 'My picks' : 'Games'}</h2><div style="margin-bottom:4px">${banner}</div>
    <div class="mute">Pick a side or the over/under on each game. Use one 2x and one 3x a week.${D.totalGames > D.games.length ? ` ${D.totalGames - D.games.length} more game(s) get added when the admin locks them.` : ''}</div>`;
  for (const g of D.games) {
    const lock = started(g) || !canPick, p = draft[g.id], res = D.results[g.id];
    const b = (pick, ok) => `<button ${lock || !ok ? 'disabled' : ''} class="${p && p.pick === pick ? 'on' : ''}"
      onclick="choose('${g.id}','${pick}')">${ok ? label(g, pick) : '—'}</button>`;
    let status = '';
    if (res) {
      const isLive = res.final === false;
      status = ` · ${isLive ? 'Live' : 'Final'} ${short(g.away)} ${res.away}, ${short(g.home)} ${res.home}`;
      if (p && D.me) { const r = grade(g, res, p); status += ` · <span class="${r.win ? 'win' : 'loss'} ${isLive ? 'live' : ''}">${isLive ? (r.win ? 'Winning' : 'Losing') : (r.win ? 'Won' : 'Lost')} ${sgn(r.pts)}</span>`; }
    } else if (started(g)) status = ' · Kicked off';
    const when = new Date(g.kickoff).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    h += `<div class="game"><div class="teams">${esc(g.away)} at ${esc(g.home)}</div>
      <div class="mute">${when}${status}</div>
      <div class="opts">${b('away', g.spread != null)}${b('home', g.spread != null)}${b('over', g.total != null)}${b('under', g.total != null)}</div>
      ${D.me ? `<div class="mults">${[1, 2, 3].map(m => `<button ${lock || !p ? 'disabled' : ''}
        class="${p && (p.mult || 1) === m ? 'on' : ''}" onclick="mult('${g.id}',${m})">${m}x</button>`).join('')}</div>` : ''}</div>`;
  }
  if (canPick && D.games.some(g => !started(g))) h += `<button class="go save" onclick="save()">Save picks</button>`;
  el.innerHTML = h;
}
function choose(gid, pick) {
  if (draft[gid] && draft[gid].pick === pick) delete draft[gid];
  else draft[gid] = { pick, mult: (draft[gid] && draft[gid].mult) || 1 };
  renderPicks();
}
function mult(gid, m) {
  if (m > 1) for (const g of D.games) {
    const p = draft[g.id];
    if (g.id !== gid && p && p.mult === m) {
      if (started(g)) { msg(`Your ${m}x is already locked on another game.`, true); return; }
      p.mult = 1;
    }
  }
  draft[gid].mult = m; renderPicks();
}
async function save() {
  try { await api('/api/picks', { method: 'POST', body: JSON.stringify({ week, picks: draft }) }); await load(week); msg('Picks saved.'); }
  catch (e) { msg(e.message, true); }
}

// Weekly board: official points (finals only) + live points (if games in progress ended now). Tap a player for details.
let openPlayer = null;
/* ---------- chance of winning the week ----------
   Monte Carlo over the games still undecided. Each one carries two independent
   coin flips: who covers the spread, and over/under. The flips happen once per
   trial and are then applied to everybody, so two players on the same side of a
   game move together — that correlation is what makes the number mean anything.
   A pick against a spread with the half-point is a 50/50 by construction, so
   there is nothing cleverer to model. */
const SIMS = 8000;
function winChances() {
  if (!D || D.manualWeek) return null;
  const games = D.games || [], rows = D.weekStandings || [], res = D.results || {};
  if (!rows.length) return null;

  const slotOf = {};
  let openCount = 0;
  for (const g of games) {
    const r = res[g.id];
    if (!r || r.final === false) slotOf[g.id] = openCount++;   // live games count as undecided
  }
  if (!openCount) return null;                                  // week is settled

  const P = rows.map(r => {
    const picks = D.picks[r.key] || {};
    const open = [], blind = [];
    for (const g of games) {
      const slot = slotOf[g.id];
      if (slot === undefined) continue;
      const p = picks[g.id];
      if (!p) continue;                                         // no pick scores nothing
      if (p.hidden) blind.push(slot); else open.push({ slot, pick: p.pick, mult: p.mult || 1 });
    }
    const spent = new Set();
    for (const p of Object.values(picks)) if (p && !p.hidden && p.mult > 1) spent.add(p.mult);
    return { key: r.key, base: Number(r.points) || 0, open, blind, free: [2, 3].filter(m => !spent.has(m)) };
  });

  const n = P.length, wins = new Float64Array(n), score = new Float64Array(n);
  const cover = new Uint8Array(openCount), over = new Uint8Array(openCount);
  const pts = (w, m) => w ? m : (m === 1 ? 0 : m === 2 ? -1 : -2);

  for (let s = 0; s < SIMS; s++) {
    for (let i = 0; i < openCount; i++) { cover[i] = Math.random() < .5 ? 1 : 0; over[i] = Math.random() < .5 ? 1 : 0; }
    let best = -Infinity;
    for (let a = 0; a < n; a++) {
      const p = P[a];
      let t = p.base;
      for (let k = 0; k < p.open.length; k++) {
        const q = p.open[k];
        const w = q.pick === 'home' ? cover[q.slot] === 1
                : q.pick === 'away' ? cover[q.slot] === 0
                : q.pick === 'over' ? over[q.slot] === 1 : over[q.slot] === 0;
        t += pts(w, q.mult);
      }
      if (p.blind.length) {              // hidden picks: side and multiplier both unknown
        const m = new Array(p.blind.length).fill(1);
        for (const f of p.free) { const i = Math.floor(Math.random() * m.length); if (m[i] === 1) m[i] = f; }
        for (let k = 0; k < m.length; k++) t += pts(Math.random() < .5, m[k]);
      }
      score[a] = t;
      if (t > best) best = t;
    }
    let tied = 0;
    for (let a = 0; a < n; a++) if (score[a] === best) tied++;
    for (let a = 0; a < n; a++) if (score[a] === best) wins[a] += 1 / tied;   // a tie splits the win
  }
  const out = {};
  for (let a = 0; a < n; a++) out[P[a].key] = wins[a] / SIMS;
  return out;
}
const chanceText = v => v == null ? '–'
  : v >= .995 ? '>99%' : (v > 0 && v < .005) ? '<1%' : Math.round(v * 100) + '%';

function renderWeekBoard() {
  const rows = D.weekStandings;
  if (!rows.length) { $('weekboard').innerHTML = '<div class="mute">No players yet. Share the link and have people join.</div>'; return; }
  let odds = null;
  try { odds = winChances(); } catch (e) { odds = null; }   // odds are a nicety; never let them break the board
  const cols = 4 + (D.hasLive ? 1 : 0) + (odds ? 1 : 0);
  let h = `<div class="scroll"><table><tr><th>#</th><th>Player</th><th>${odds ? 'W–L' : 'Right–wrong'}</th><th>Pts</th>${D.hasLive ? '<th>Live</th>' : ''}${odds ? '<th>Odds</th>' : ''}</tr>`;
  rows.forEach((r, i) => {
    h += `<tr class="pick-row ${openPlayer === r.key ? 'sel' : ''}" onclick="togglePlayer('${r.key}')"><td>${i + 1}</td><td>${esc(r.name)} ›</td>
      <td>${r.correct}–${r.wrong}</td><td class="num">${r.points}</td>${D.hasLive ? `<td class="num live">${r.live}</td>` : ''}${
        odds ? `<td class="odds"><b>${chanceText(odds[r.key])}</b><span class="bar"><i style="width:${Math.round((odds[r.key] || 0) * 100)}%"></i></span></td>` : ''}</tr>`;
    if (openPlayer === r.key) h += `<tr><td class="detail" colspan="${cols}"><div class="detail-wrap">${playerDetail(r.key)}</div></td></tr>`;
  });
  $('weekboard').innerHTML = h + `</table></div><div class="mute" style="margin-top:6px">${D.manualWeek ? 'Results for this week were entered by the admin and replace the site\'s own scoring. ' : ''}Tap a player to see their picks.${D.hasLive ? ' Live = points if games in progress ended right now.' : ''}${
    odds ? ' Odds = how often they win the week across 8,000 simulated finishes, every undecided game a coin flip. Ties split the win; hidden picks are treated as unknown.' : ''}</div>`;
}
function togglePlayer(k) { openPlayer = openPlayer === k ? null : k; renderWeekBoard(); }
function playerDetail(k) {
  const picks = D.picks[k] || {};
  if (!D.games.length) return '<div class="mute">No games this week.</div>';
  let h = '<table><tr><th>Game</th><th>Pick</th><th>Score</th><th>Result</th></tr>';
  for (const g of D.games) {
    const p = picks[g.id], res = D.results[g.id];
    const score = res ? `${short(g.away)} ${res.away}–${res.home} ${short(g.home)}${res.final === false ? ' <span class="live">live</span>' : ''}` : '–';
    let pick = '–', result = '<span class="mute">No pick</span>';
    if (p && p.hidden) { pick = '🔒'; result = '<span class="mute">Hidden</span>'; }
    else if (p) {
      pick = label(g, p.pick) + (p.mult > 1 ? ` <b>${p.mult}x</b>` : '');
      if (res) { const r = grade(g, res, p); result = `<span class="${r.win ? 'win' : 'loss'} ${res.final === false ? 'live' : ''}">${res.final === false ? (r.win ? 'Winning' : 'Losing') : (r.win ? 'Won' : 'Lost')} ${sgn(r.pts)}</span>`; }
      else result = '<span class="mute">Pending</span>';
    }
    h += `<tr><td>${short(g.away)} at ${short(g.home)}</td><td>${pick}</td><td>${score}</td><td>${result}</td></tr>`;
  }
  return h + '</table>';
}

// Season leaderboard: ranked by win % (right / total picks), points shown alongside
const pctText = p => p == null ? '–' : (p * 100).toFixed(1) + '%';
function seasonBoard(rows) {
  if (!rows.length) return '<div class="mute">No players yet. Share the link and have people join.</div>';
  return `<div class="scroll"><table><tr><th>#</th><th>Player</th><th>Win %</th><th>Right–wrong</th><th>Points</th></tr>` +
    rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td class="num">${pctText(r.pct)}</td><td>${r.correct}–${r.wrong}</td><td class="mute">${r.points}</td></tr>`).join('') +
    '</table></div><div class="mute" style="margin-top:6px">Ranked by win % (right ÷ total picks). Ties go to points.</div>';
}
function board(rows) {
  if (!rows.length) return '<div class="mute">No players yet. Share the link and have people join.</div>';
  return `<table><tr><th>#</th><th>Player</th><th>Right–wrong</th><th>Points</th></tr>` +
    rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.correct}–${r.wrong}</td><td class="num">${r.points}</td></tr>`).join('') + '</table>';
}

function renderGrid() {
  const ps = Object.entries(D.players).sort((a, b) => a[1].localeCompare(b[1]));
  if (!D.games.length || !ps.length) { $('grid').innerHTML = '<div class="mute">Nothing to show yet.</div>'; return; }
  const cell = (g, k) => {
    const p = (D.picks[k] || {})[g.id];
    if (!p) return { c: '–', cls: 'mute', picked: false };
    if (p.hidden) return { c: '🔒', cls: '', picked: true };
    let cls = '';
    const res = D.results[g.id];
    if (res) cls = (grade(g, res, p).win ? 'win' : 'loss') + (res.final === false ? ' live' : '');
    return { c: label(g, p.pick) + (p.mult > 1 ? ` <b>${p.mult}x</b>` : ''), cls, picked: true };
  };
  // wide screens: one table, games down the side, players across the top
  let h = `<div class="grid-wide"><table><tr><th>Game</th>${ps.map(([, n]) => `<th>${esc(n)}</th>`).join('')}</tr>`;
  for (const g of D.games) {
    h += `<tr><td>${short(g.away)} at ${short(g.home)}</td>`;
    for (const [k] of ps) { const x = cell(g, k); h += `<td class="${x.cls}">${x.c}</td>`; }
    h += '</tr>';
  }
  h += '</table></div>';
  // phones: one block per game, players wrap two to a row so nothing scrolls sideways
  h += '<div class="grid-narrow">';
  for (const g of D.games) {
    const cells = ps.map(([k, n]) => [n, cell(g, k)]);
    const n = cells.filter(([, x]) => x.picked).length;
    h += `<div class="gcard"><div class="ghead"><span class="gteams">${short(g.away)} at ${short(g.home)}</span>` +
         `<span class="gcount${n === ps.length ? ' all' : ''}">${n}/${ps.length} in</span></div><div class="gpicks">` +
         cells.map(([nm, x]) => `<div class="gp${x.picked ? '' : ' none'}"><span class="gn">${esc(nm)}</span>` +
           `<span class="gv ${x.cls}">${x.c === '🔒' ? '🔒 In' : x.picked ? x.c : 'No pick'}</span></div>`).join('') +
         '</div></div>';
  }
  h += '</div>';
  $('grid').innerHTML = h + '<div class="mute" style="margin-top:6px">🔒 means they picked; it shows when picks close or at kickoff.</div>';
}

// ---------- Money board ----------
const usd = x => '$' + Number(x).toFixed(2);
// Opens the Venmo app (or venmo.com) on a payment to that person, amount and note filled in
const payLink = (handle, amount, wk) => 'https://venmo.com/' + encodeURIComponent(handle) +
  '?txn=pay&amount=' + Number(amount).toFixed(2) + '&note=' + encodeURIComponent('Fantasy Week ' + wk);
function myDebts() {
  if (!D.me) return '';
  const mine = (D.debts || []).filter(d => !d.paid && d.from === D.me).sort((a, b) => a.week - b.week);
  if (!mine.length) return '';
  return `<div class="owe"><h2>You owe</h2>` + mine.map(d => {
    const who = esc(D.players[d.to] || d.to), h = (D.venmo || {})[d.to];
    return `<div class="owe-row"><div><b>${who}</b><div class="mute">Week ${d.week} · ${usd(d.amount)}</div></div>` +
      (h ? `<a class="pay" href="${payLink(h, d.amount, d.week)}" target="_blank" rel="noopener">Pay ${usd(d.amount)}</a>`
         : `<span class="mute" style="font-size:12px">No Venmo on file</span>`) + '</div>';
  }).join('') + '</div>';
}
const venmo = k => (D.venmo || {})[k] ? `<a class="venmo" href="https://venmo.com/u/${encodeURIComponent(D.venmo[k])}" target="_blank" rel="noopener">@${esc(D.venmo[k])}</a>` : '';
function venmoList() {
  const ps = Object.entries(D.players).filter(([k]) => (D.venmo || {})[k]).sort((a, b) => a[1].localeCompare(b[1]));
  return ps.length ? `<h2 style="margin-top:18px">League Venmos</h2><table>` +
    ps.map(([k, n]) => `<tr><td>${esc(n)}</td><td>${venmo(k)}</td></tr>`).join('') + '</table>' : '';
}
function renderMoney() {
  const list = (D.debts || []).slice().sort((a, b) => a.paid - b.paid || b.week - a.week);
  if (!list.length) { $('money').innerHTML = '<div class="mute">Nothing owed yet.</div>' + venmoList(); return; }
  let mine = myDebts();
  const nm = k => esc(D.players[k] || k);
  const bal = {};
  for (const d of list) if (!d.paid) { bal[d.from] = (bal[d.from] || 0) - d.amount; bal[d.to] = (bal[d.to] || 0) + d.amount; }
  const people = Object.entries(bal).filter(([, v]) => Math.abs(v) > 0.001).sort((a, b) => a[1] - b[1]);
  let h = mine + (people.length ? `<table style="margin-bottom:14px"><tr><th>Player</th><th>Still owes / is owed</th></tr>` +
    people.map(([k, v]) => `<tr><td>${nm(k)}</td><td class="${v < 0 ? 'loss' : 'win'}">${v < 0 ? 'Owes ' + usd(-v) : 'Is owed ' + usd(v) + ' ' + venmo(k)}</td></tr>`).join('') + '</table>'
    : '<div class="win" style="margin-bottom:10px">Everyone is paid up.</div>');
  h += `<table><tr><th>Wk</th><th>Who owes</th><th>To</th><th>Amount</th><th>Status</th>${isAdmin ? '<th></th>' : ''}</tr>`;
  for (const d of list) {
    h += `<tr class="${d.paid ? 'paid' : ''}"><td>${d.week}</td><td>${nm(d.from)}</td><td>${nm(d.to)}${d.paid ? '' : ' ' + venmo(d.to)}</td><td>${usd(d.amount)}</td>
      <td class="keep ${d.paid ? 'win' : 'loss'}">${d.paid ? 'Paid' : 'Unpaid'}</td>
      ${isAdmin ? `<td class="keep"><button class="sm" onclick="adminCall('debtPaid',{id:'${d.id}'})">${d.paid ? 'Undo' : 'Mark paid'}</button>
      <button class="sm" onclick="if(confirm('Delete this entry?'))adminCall('debtDelete',{id:'${d.id}'})">Delete</button></td>` : ''}</tr>`;
  }
  $('money').innerHTML = h + '</table>' + venmoList();
}
function addDebt() {

}

// ---------- Admin panel: the only place the Odds API gets called ----------
let adminPw = sessionStorage.getItem('adminPw'), isAdmin = false, lastStatus = null;
function adminLock() { adminPw = null; isAdmin = false; sessionStorage.removeItem('adminPw'); renderAdminLogin(); renderMoney(); }
function toggleAdmin() {
  const el = $('admin'); el.hidden = !el.hidden;
  if (!el.hidden) { adminPw ? adminCall('status') : renderAdminLogin(); el.scrollIntoView({ behavior: 'smooth' }); }
}
function renderAdminLogin(err) {
  $('admin').innerHTML = `<h2>Admin</h2>
    <div class="row"><input id="apw" type="password" placeholder="Admin password"><button class="go" onclick="adminLogin()">Unlock</button></div>
    ${err ? `<div class="loss" style="margin-top:8px">${esc(err)}</div>` : ''}`;
}
function adminLogin() { adminPw = $('apw').value; adminCall('status'); }
async function adminCall(action, extra = {}) {
  const btns = $('admin').querySelectorAll('button'); btns.forEach(b => b.disabled = true);
  try {
    const j = await api('/api/admin', { method: 'POST', body: JSON.stringify({ password: adminPw, action, week, ...extra }) });
    sessionStorage.setItem('adminPw', adminPw); isAdmin = true; lastStatus = j;
    if (action !== 'status') await load(week);
    renderAdmin(j, { lines: 'Lines refreshed.', lock: 'Lines locked.', open: 'Picks opened.', close: 'Picks closed.',
      scores: 'Scores refreshed.', debtAdd: 'Added to who owes who.', debtPaid: 'Payment updated.', debtDelete: 'Entry deleted.', venmo: 'Venmo saved.', reset: 'Week reset. Start again with Refresh lines.', pin: 'PIN changed.', removePlayer: 'Player removed.', lockGames: 'Games locked.', manual: 'Week results saved.' }[action] || '');
    renderMoney();
  } catch (e) {
    if (/password/i.test(e.message)) { adminLock(); renderAdminLogin(e.message); }
    else if (lastStatus) renderAdmin(lastStatus, e.message, true);
    else { renderAdminLogin(); $('admin').insertAdjacentHTML('beforeend', `<div class="loss">${esc(e.message)}</div>`); }
  }
}

// Lock lines game by game, grouped by day (lock Thursday on Thursday, Sunday on Sunday...)
function gameLocks(j) {
  const games = j.gameList || [];
  if (!games.length) return '<div class="mute" style="margin-top:8px">No games yet. Tap Refresh lines.</div>';
  const days = {};
  for (const g of games) {
    const d = new Date(g.kickoff).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
    (days[d] = days[d] || []).push(g);
  }
  let h = '<div style="margin-top:10px">';
  for (const [day, list] of Object.entries(days)) {
    const openIds = list.filter(g => !g.lineLocked).map(g => g.id);
    h += `<div class="stat" style="font-weight:600"><span>${esc(day)}</span>
      ${openIds.length ? `<button class="sm go" onclick="lockIds(${JSON.stringify(openIds).replace(/"/g, '&quot;')})">Lock ${openIds.length} game${openIds.length > 1 ? 's' : ''}</button>`
        : '<span class="win">All locked</span>'}</div>`;
    for (const g of list) {
      const time = new Date(g.kickoff).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      h += `<div class="stat"><span class="mute">${short(g.away)} at ${short(g.home)} · ${time}</span>
        ${g.lineLocked ? '<span class="win">Locked</span>' : `<button class="sm" onclick="lockIds(['${g.id}'])">Lock</button>`}</div>`;
    }
  }
  return h + '</div>';
}
function lockIds(ids) {
  if (confirm(`Lock ${ids.length} game${ids.length > 1 ? 's' : ''}? Their lines cannot change after this.`)) adminCall('lockGames', { ids });
}

// Type in results for weeks played before the site existed
function manualForm(j) {
  const ps = Object.entries(D.players).sort((a, b) => a[1].localeCompare(b[1]));
  if (!ps.length) return '<div class="mute">No players yet.</div>';
  const m = j.manual || {};
  let h = `<div class="mute" style="margin-bottom:8px">Type points, right and wrong for each player. Saving replaces everything the site scored this week, for the week and season totals. Leave a player blank for zero. Save with every box empty to go back to the site's own scoring.</div>
    <div class="scroll"><table><tr><th>Player</th><th>Points</th><th>Right</th><th>Wrong</th></tr>`;
  for (const [k, n] of ps) {
    const v = m[k] || {};
    h += `<tr><td>${esc(n)}</td>
      <td><input id="mp-${esc(k)}" type="number" step="1" style="min-width:70px" value="${v.points ?? ''}"></td>
      <td><input id="mc-${esc(k)}" type="number" min="0" step="1" style="min-width:70px" value="${v.correct ?? ''}"></td>
      <td><input id="mw-${esc(k)}" type="number" min="0" step="1" style="min-width:70px" value="${v.wrong ?? ''}"></td></tr>`;
  }
  return h + `</table></div><div class="row"><button class="go" onclick="saveManual()">Save week ${j.week} results</button></div>`;
}
function saveManual() {
  const entries = {};
  for (const k of Object.keys(D.players))
    entries[k] = { points: $('mp-' + k).value, correct: $('mc-' + k).value, wrong: $('mw-' + k).value };
  adminCall('manual', { entries });
}

// Player list for the admin: season points, Venmo, change PIN, remove
function playerAdmin() {
  const ps = Object.entries(D.players).sort((a, b) => a[1].localeCompare(b[1]));
  if (!ps.length) return '<div class="mute">No players yet.</div>';
  const pts = Object.fromEntries((D.season || []).map(r => [r.key, r]));
  return `<div class="scroll"><table><tr><th>Player</th><th>Season</th><th>Venmo</th><th></th></tr>` + ps.map(([k, n]) => {
    const r = pts[k] || { points: 0, correct: 0, wrong: 0 };
    return `<tr><td>${esc(n)}</td><td>${r.points} pts (${r.correct}–${r.wrong})</td><td>${venmo(k) || '<span class="mute">–</span>'}</td>
      <td><button class="sm" onclick="changePin('${esc(k)}')">Change PIN</button>
      <button class="sm danger" onclick="removePlayer('${esc(k)}')">Remove</button></td></tr>`;
  }).join('') + `</table></div><div class="mute" style="margin-top:6px">Removing a player deletes their account, Venmo and all their picks. Who owes who entries stay.</div>`;
}
function resetWeek(n) {
  const a = prompt(`This erases Week ${n} lines, lock, pick window, all picks and scores. Type RESET to confirm.`);
  if (a && a.trim().toUpperCase() === 'RESET') adminCall('reset');
}
function changePin(k) {
  const pin = prompt(`New PIN for ${D.players[k]} (4–8 digits):`);
  if (pin !== null) adminCall('pin', { player: k, pin: pin.trim() });
}
function removePlayer(k) {
  const n = D.players[k];
  if (prompt(`This permanently removes ${n} and all their picks. Type their name to confirm:`)?.trim().toLowerCase() === n.toLowerCase())
    adminCall('removePlayer', { player: k });
}


// ---------- Tabs: four panels side by side; drag across the tab bar to scrub between them ----------
const TABS = { i: 0, n: 4 }, TAB_PAD = 6;
function tabLayout(x) { // x = fractional panel index
  const panels = document.querySelectorAll('.panel');
  panels.forEach(p => { p.style.transform = `translateX(${-x * 100}%)`; });
  const btns = [...document.querySelectorAll('#tabs button')];
  const a = btns[Math.floor(x)], b = btns[Math.min(TABS.n - 1, Math.ceil(x))], f = x - Math.floor(x);
  const bar = $('tabs').getBoundingClientRect(), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  const left = ra.left + (rb.left - ra.left) * f - bar.left - TAB_PAD, width = ra.width + (rb.width - ra.width) * f;
  $('thumb').style.width = width + 'px';
  $('thumb').style.transform = `translateX(${left}px)`;
  const near = Math.round(x);
  btns.forEach((btn, j) => btn.classList.toggle('on', j === near));
  // hide off-screen panels from screen readers and keyboard focus
  panels.forEach((p, j) => { if (j === near) p.removeAttribute('inert'); else p.setAttribute('inert', ''); p.setAttribute('aria-hidden', j === near ? 'false' : 'true'); });
  fitHeight(x);
}
function fitHeight(x) { // the viewport is as tall as the panel(s) on screen, so short tabs don't leave empty scroll
  const panels = document.querySelectorAll('.panel');
  const h = Math.max(panels[Math.floor(x)].offsetHeight, panels[Math.min(TABS.n - 1, Math.ceil(x))].offsetHeight);
  document.querySelector('.viewport').style.height = h + 'px';
}
function showTab(i) {
  const changed = i !== TABS.i;
  TABS.i = Math.max(0, Math.min(TABS.n - 1, i));
  tabLayout(TABS.i);
  const top = $('track').getBoundingClientRect().top + window.scrollY - document.querySelector('header').offsetHeight - 8;
  if (changed && window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
(function initTabs() {
  const bar = $('tabs');
  let drag = null, raf = 0, pendingX = null;
  const toIndex = clientX => {
    const r = bar.getBoundingClientRect(), seg = (r.width - TAB_PAD * 2) / TABS.n;
    return Math.max(0, Math.min(TABS.n - 1, (clientX - r.left - TAB_PAD) / seg - 0.5));
  };
  const paint = () => { raf = 0; if (pendingX !== null) tabLayout(toIndex(pendingX)); };
  bar.addEventListener('pointerdown', e => {
    drag = { x0: e.clientX, moved: false, id: e.pointerId, lastX: e.clientX, lastT: e.timeStamp, v: 0 };
    bar.setPointerCapture(e.pointerId);
    bar.classList.add('pressing');
  });
  bar.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dt = e.timeStamp - drag.lastT;
    if (dt > 0) drag.v = 0.8 * ((e.clientX - drag.lastX) / dt) + 0.2 * drag.v; // px per ms, smoothed
    drag.lastX = e.clientX; drag.lastT = e.timeStamp;
    if (!drag.moved && Math.abs(e.clientX - drag.x0) < 6) return;
    if (!drag.moved) { drag.moved = true; document.body.classList.add('dragging'); }
    pendingX = e.clientX;
    if (!raf) raf = requestAnimationFrame(paint); // one layout per frame keeps the drag smooth
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const { moved, v } = drag; drag = null; pendingX = null;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    bar.classList.remove('pressing');
    document.body.classList.remove('dragging');
    let target = toIndex(e.clientX);
    if (moved && Math.abs(v) > 0.3) target = v > 0 ? Math.ceil(target) : Math.floor(target); // a quick flick carries to the next tab
    showTab(Math.round(target));
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', e => { if (drag) { drag = null; bar.classList.remove('pressing'); document.body.classList.remove('dragging'); showTab(TABS.i); } });
  bar.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') showTab(TABS.i + 1); else if (e.key === 'ArrowLeft') showTab(TABS.i - 1); else return;
    bar.querySelectorAll('button')[TABS.i].focus();
  });
  bar.querySelectorAll('button').forEach(b => b.addEventListener('click', e => { if (e.detail === 0) showTab(+b.dataset.i); }));
  if ('ResizeObserver' in window) new ResizeObserver(() => fitHeight(TABS.i)).observe($('track'));
  document.querySelectorAll('.panel').forEach(p => new MutationObserver(() => fitHeight(TABS.i)).observe(p, { childList: true, subtree: true }));
  window.addEventListener('resize', () => tabLayout(TABS.i));
  tabLayout(0);
  if (document.fonts) document.fonts.ready.then(() => tabLayout(TABS.i));
})();

// Press feedback: buttons dip while held, then a soft ring spreads out on release
(function () {
  const SEL = '.go, .danger, .pay';
  const off = () => document.querySelectorAll('.tap').forEach(b => b.classList.remove('tap'));
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest(SEL); if (!b || b.disabled) return;
    b.classList.add('tap');
    b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring');
    if (navigator.vibrate) navigator.vibrate(8);
  }, { passive: true });
  ['pointerup', 'pointercancel', 'dragstart'].forEach(t => document.addEventListener(t, () => setTimeout(off, 90), { passive: true }));
  document.addEventListener('animationend', e => { if (e.animationName === 'ring') e.target.classList.remove('ring'); });
})();

load();
</script>
